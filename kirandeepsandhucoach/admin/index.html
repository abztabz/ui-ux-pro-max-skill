<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Kiran Deep Sandhu — Site Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#12181B; --teal:#1C3532; --teal-deep:#132523;
    --accent:#B07A34; --accent-dark:#8A5E26; --accent-tint:#D7B87A;
    --paper:#F6F2E9; --paper-alt:#ECE5D6;
    --line:rgba(18,24,27,0.14); --mute:#6E6656;
    --sidebar-w:230px; --topbar-h:60px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
  .hide{display:none !important}

  /* ---------- Login ---------- */
  .login{max-width:380px;margin:10vh auto;text-align:center;padding:0 1rem}
  .login .card{background:var(--paper-alt);border:1px solid var(--line);border-radius:6px;padding:2rem}
  .login b{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:600}
  .login label{display:block;text-align:left;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:1.1rem 0 .35rem}
  .login input{width:100%;padding:.7rem .85rem;border:1px solid var(--line);border-radius:4px;font:inherit;background:#fff}
  .login input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .login .btn{margin-top:1.1rem}
  .muted{color:var(--mute);font-size:.9rem}

  .btn{display:inline-flex;align-items:center;gap:.4rem;border:none;border-radius:4px;padding:.72rem 1.4rem;font:inherit;font-weight:700;cursor:pointer}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff}
  .btn-primary:disabled{opacity:.55;cursor:default}
  .status{font-size:.88rem}
  .status.ok{color:#2e7d51}.status.err{color:#b4453a}

  /* ---------- Dashboard shell ---------- */
  .shell{display:none}
  .shell.on{display:block}

  aside{
    position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
    background:var(--teal-deep);color:var(--paper);
    display:flex;flex-direction:column;z-index:20;
  }
  .side-brand{padding:1.1rem 1.2rem .9rem;border-bottom:1px solid rgba(246,242,233,.12)}
  .side-brand b{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;display:block}
  .side-brand span{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(246,242,233,.5)}
  .side-label{font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(246,242,233,.45);padding:1.1rem 1.2rem .4rem}
  nav.pages{flex:1;overflow-y:auto}
  nav.pages a{
    display:flex;justify-content:space-between;align-items:center;
    padding:.62rem 1.2rem;color:rgba(246,242,233,.82);text-decoration:none;
    font-size:.92rem;font-weight:600;border-left:3px solid transparent;
  }
  nav.pages a:hover{background:rgba(246,242,233,.06)}
  nav.pages a.active{background:rgba(176,122,52,.18);border-left-color:var(--accent);color:#fff}
  nav.pages a .count{font-size:.7rem;font-weight:700;color:rgba(246,242,233,.4)}
  .side-foot{padding:1rem 1.2rem;border-top:1px solid rgba(246,242,233,.12);font-size:.85rem}
  .side-foot a{color:var(--accent-tint);text-decoration:none;font-weight:600;display:block;padding:.25rem 0}

  .topbar{
    position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--topbar-h);
    background:#fff;border-bottom:1px solid var(--line);z-index:10;
    display:flex;align-items:center;gap:1rem;padding:0 1.4rem;
  }
  .topbar h1{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dirty-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:none;flex-shrink:0}
  .dirty .dirty-dot{display:block}

  main.content{margin-left:var(--sidebar-w);padding:calc(var(--topbar-h) + 1.5rem) 1.6rem 6rem;max-width:840px}
  .page-panel{display:none}
  .page-panel.on{display:block}
  .panel-tip{font-size:.85rem;color:var(--mute);margin:0 0 1.2rem}
  .panel-tip code{background:var(--paper-alt);border:1px solid var(--line);border-radius:3px;padding:0 .3em;font-size:.9em}

  .block{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:.9rem;overflow:hidden}
  .block:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .block-head{display:flex;align-items:center;gap:.5rem;padding:.5rem .9rem 0}
  .chip{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.18rem .5rem;border-radius:3px}
  .chip-h{background:rgba(28,53,50,.1);color:var(--teal)}
  .chip-p{background:rgba(18,24,27,.06);color:var(--mute)}
  .chip-l{background:rgba(176,122,52,.13);color:var(--accent-dark)}
  .chip-q{background:rgba(176,122,52,.2);color:var(--accent-dark)}
  .block textarea{
    display:block;width:100%;border:none;background:transparent;resize:none;
    font:inherit;color:var(--ink);padding:.55rem .95rem .8rem;line-height:1.5;overflow:hidden;
  }
  .block textarea:focus{outline:none}
  .block.is-h textarea{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600}
  .block.is-l textarea{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

  .loading{padding:4rem 0;text-align:center;color:var(--mute)}

  /* ---------- Mobile ---------- */
  @media (max-width:820px){
    aside{position:static;width:auto;flex-direction:column}
    nav.pages{display:flex;overflow-x:auto;border-top:none}
    nav.pages a{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:.6rem .9rem}
    nav.pages a.active{border-bottom-color:var(--accent)}
    nav.pages a .count{display:none}
    .side-label,.side-foot{display:none}
    .topbar{position:sticky;left:0}
    main.content{margin-left:0;padding:1.2rem 1rem 5rem}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="card">
    <b>Kiran Deep Sandhu — Site Editor</b>
    <p class="muted">Log in to edit your website's text, page by page.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" />
    <button class="btn btn-primary" id="loginBtn">Log in</button>
    <p id="loginMsg" class="status err"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="shell" class="shell">
  <aside>
    <div class="side-brand">
      <b>Kiran Deep Sandhu</b>
      <span>Site Editor</span>
    </div>
    <div class="side-label">Pages</div>
    <nav class="pages" id="pageNav"></nav>
    <div class="side-foot">
      <a href="../index.html" target="_blank" rel="noopener">↗ View site</a>
      <a href="#" id="logout">Log out</a>
    </div>
  </aside>

  <div class="topbar">
    <h1 id="panelTitle">Home</h1>
    <span class="dirty-dot" title="Unsaved changes"></span>
    <span id="saveMsg" class="status"></span>
    <button class="btn btn-primary" id="saveBtn">Save Changes</button>
  </div>

  <main class="content" id="content">
    <div class="loading" id="loading">Loading your pages…</div>
  </main>
</div>

<script>
(function () {
  var PAGES = [
    { file: 'index.html',        prefix: 'home',         label: 'Home' },
    { file: 'about.html',        prefix: 'about',        label: 'About' },
    { file: 'coaching.html',     prefix: 'coaching',     label: 'Coaching' },
    { file: 'training.html',     prefix: 'training',     label: 'Training' },
    { file: 'speaking.html',     prefix: 'speaking',     label: 'Speaking' },
    { file: 'testimonials.html', prefix: 'testimonials', label: 'Testimonials' },
    { file: 'contact.html',      prefix: 'contact',      label: 'Contact' }
  ];

  var sessionPw = null;
  var dirty = false;
  var loginView = document.getElementById('login');
  var shell = document.getElementById('shell');
  var pw = document.getElementById('pw');
  var loginMsg = document.getElementById('loginMsg');
  var saveMsg = document.getElementById('saveMsg');
  var saveBtn = document.getElementById('saveBtn');
  var pageNav = document.getElementById('pageNav');
  var content = document.getElementById('content');
  var panelTitle = document.getElementById('panelTitle');
  var topbar = document.querySelector('.topbar');

  function chipFor(el) {
    var cls = el.className || '';
    var tag = el.tagName.toLowerCase();
    if (tag === 'h1') return { text: 'Page headline', chip: 'chip-h', kind: 'is-h' };
    if (tag === 'h2' || tag === 'h3') return { text: 'Heading', chip: 'chip-h', kind: 'is-h' };
    if (cls.indexOf('testimonial-quote') !== -1) return { text: 'Testimonial', chip: 'chip-q', kind: '' };
    if (cls.indexOf('eyebrow') !== -1 || cls.indexOf('kicker') !== -1) return { text: 'Small label', chip: 'chip-l', kind: 'is-l' };
    if (cls.indexOf('lede') !== -1) return { text: 'Subheading', chip: 'chip-p', kind: '' };
    return { text: 'Paragraph', chip: 'chip-p', kind: '' };
  }

  function autosize(ta) {
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight + 2) + 'px';
  }

  function markDirty() {
    if (!dirty) { dirty = true; topbar.classList.add('dirty'); }
    saveMsg.textContent = '';
    saveMsg.className = 'status';
  }

  function showPage(prefix) {
    Array.prototype.forEach.call(document.querySelectorAll('.page-panel'), function (p) {
      p.classList.toggle('on', p.getAttribute('data-page') === prefix);
    });
    Array.prototype.forEach.call(pageNav.querySelectorAll('a'), function (a) {
      a.classList.toggle('active', a.getAttribute('data-page') === prefix);
    });
    var page = PAGES.filter(function (p) { return p.prefix === prefix; })[0];
    panelTitle.textContent = page ? page.label : '';
    Array.prototype.forEach.call(
      document.querySelectorAll('.page-panel.on textarea'), autosize);
    window.scrollTo(0, 0);
  }

  function build(saved) {
    var parser = new DOMParser();
    var loads = PAGES.map(function (page) {
      return fetch('../' + page.file, { cache: 'no-cache' })
        .then(function (r) { return r.text(); })
        .then(function (html) {
          var doc = parser.parseFromString(html, 'text/html');
          return {
            page: page,
            blocks: Array.prototype.slice.call(doc.querySelectorAll('[data-edit]'))
          };
        });
    });

    return Promise.all(loads).then(function (results) {
      document.getElementById('loading').remove();

      results.forEach(function (res) {
        var navLink = document.createElement('a');
        navLink.href = '#';
        navLink.setAttribute('data-page', res.page.prefix);
        navLink.innerHTML = res.page.label +
          ' <span class="count">' + res.blocks.length + '</span>';
        navLink.addEventListener('click', function (e) {
          e.preventDefault();
          showPage(res.page.prefix);
        });
        pageNav.appendChild(navLink);

        var panel = document.createElement('div');
        panel.className = 'page-panel';
        panel.setAttribute('data-page', res.page.prefix);

        var tip = document.createElement('p');
        tip.className = 'panel-tip';
        tip.innerHTML = 'Edit any block below, then hit <b>Save Changes</b>. ' +
          'For emphasis you can wrap words in <code>&lt;em&gt;…&lt;/em&gt;</code> (italic) or <code>&lt;strong&gt;…&lt;/strong&gt;</code> (bold).';
        panel.appendChild(tip);

        res.blocks.forEach(function (el) {
          var key = el.getAttribute('data-edit');
          var meta = chipFor(el);
          // Plain-text blocks read via textContent so the editor never sees
          // entities like &amp;. Blocks with real formatting keep their HTML.
          var raw = el.children.length
            ? el.innerHTML
            : el.textContent;
          var value = (saved && saved[key] != null && String(saved[key]).trim() !== '')
            ? saved[key]
            : raw.trim().replace(/\s+/g, ' ');

          var block = document.createElement('div');
          block.className = 'block ' + meta.kind;
          block.innerHTML =
            '<div class="block-head"><span class="chip ' + meta.chip + '">' + meta.text + '</span></div>';

          var ta = document.createElement('textarea');
          ta.rows = 1;
          ta.value = value;
          ta.setAttribute('data-key', key);
          ta.addEventListener('input', function () { autosize(ta); markDirty(); });
          block.appendChild(ta);
          panel.appendChild(block);
        });

        content.appendChild(panel);
      });

      showPage('home');
    });
  }

  document.getElementById('loginBtn').addEventListener('click', function () {
    if (!pw.value) { loginMsg.textContent = 'Enter your password.'; return; }
    sessionPw = pw.value;
    loginView.classList.add('hide');
    shell.classList.add('on');
    fetch('../data/pages.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; })
      .then(build);
  });

  pw.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  document.getElementById('logout').addEventListener('click', function (e) {
    e.preventDefault();
    location.reload();
  });

  saveBtn.addEventListener('click', function () {
    var data = {};
    Array.prototype.forEach.call(document.querySelectorAll('textarea[data-key]'), function (ta) {
      data[ta.getAttribute('data-key')] = ta.value;
    });

    saveMsg.textContent = 'Saving…';
    saveMsg.className = 'status';
    saveBtn.disabled = true;

    fetch('/.netlify/functions/save-content', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: sessionPw, data: data })
    })
      .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
      .then(function (res) {
        if (res.ok) {
          dirty = false;
          topbar.classList.remove('dirty');
          saveMsg.textContent = res.body.message || 'Saved.';
          saveMsg.className = 'status ok';
        } else {
          saveMsg.textContent = res.body.error || 'Save failed.';
          saveMsg.className = 'status err';
        }
      })
      .catch(function () {
        saveMsg.textContent = 'Save failed — check your connection.';
        saveMsg.className = 'status err';
      })
      .finally(function () { saveBtn.disabled = false; });
  });

  window.addEventListener('beforeunload', function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });
})();
</script>
</body>
</html>
